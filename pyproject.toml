[project]
name = "time-series-lab"
version = "0.3.0"
description = "Laboratório didático e reproduzível de séries temporais e previsão probabilística"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
]

[dependency-groups]
dev = [
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_series_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

